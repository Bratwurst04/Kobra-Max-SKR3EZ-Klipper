# === PRINT_START ===
[gcode_macro PRINT_START]
description: Start a print with heating, homing, KAMP mesh and adaptive purge
gcode:
    {% set BED = params.BED|default(55)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(210)|float %}

    # Set units and coordinate/extrusion modes.
    G21
    G90
    M83
    M107

    # Start bed heating and preheat the nozzle
    # to reduce waiting and limit oozing.
    M140 S{BED}
    M104 S150

    # Home X/Y while the bed heats.
    G28 X Y

    # Wait for the bed target before Z homing and meshing.
    M190 S{BED}

    # Home Z with the heated bed and preheated nozzle.
    G28 Z

    # Clear any old mesh and create a KAMP mesh
    # around the objects in the current G-code.
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE

    # Park near the model while the nozzle reaches its target.
    SMART_PARK
    M109 S{EXTRUDER}

    # Adaptive purge near the print area.
    LINE_PURGE

    G92 E0
; === PRINT_START end ===



[delayed_gcode LED_ON]
initial_duration: 1 	# Start the LED sequence 1 second after Klipper starts.

gcode:
    SET_PIN PIN=nozzle_led VALUE=1 # 1=on 0=off
    G4 P500
    SET_PIN PIN=nozzle_led VALUE=0 # 1=on 0=off
    G4 P500
    SET_PIN PIN=nozzle_led VALUE=1 # 1=on 0=off
    G4 P500
    SET_PIN PIN=nozzle_led VALUE=0 # 1=on 0=off
    G4 P500
    SET_PIN PIN=nozzle_led VALUE=1 # 1=on 0=off
