# Anycubic Kobra Max
# BTT SKR 3 EZ v1.0
# X, Y och dubbla parallellkopplade Z-motorer

# === X-AXEL ===

[stepper_x]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6

microsteps: 64
rotation_distance: 40

endstop_pin: ^!PC1
position_endstop: 0
position_min: 0
position_max: 415

homing_speed: 50
homing_retract_dist: 5
homing_retract_speed: 10
second_homing_speed: 10

# === Y-AXEL ===

[stepper_y]
step_pin: PA15
dir_pin: PA8
enable_pin: !PD1

microsteps: 64
rotation_distance: 40

endstop_pin: ^!PC3
position_endstop: 0
position_min: 0
position_max: 438

homing_speed: 40
homing_retract_dist: 5
homing_retract_speed: 10
second_homing_speed: 10

# === Z-AXEL ===

[stepper_z]
step_pin: PE2
dir_pin: PE3
enable_pin: !PE0

microsteps: 16
rotation_distance: 8

endstop_pin: probe:z_virtual_endstop

position_min: -5
position_max: 450

homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 3

# === Extruder ===

[extruder]
step_pin: PD15
dir_pin: PD14
enable_pin: !PC7

microsteps: 16

rotation_distance: 22.350
gear_ratio: 3:1

nozzle_diameter: 0.400
filament_diameter: 1.750

pressure_advance: 0.44
pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 5

# Extruder Heater
heater_pin: PB3
sensor_pin: PA2
sensor_type: EPCOS 100K B57560G104F

# === MACHINE-SPECIFIC STARTING VALUES ===
# === Run PID_CALIBRATE and replace these values. ===
control: pid
pid_Kp: 33.01
pid_Ki: 3.25
pid_Kd: 83.84

min_temp: 18
max_temp: 280 # Max enligt Anycubic 260
min_extrude_temp: 170 # Kör inte Extruder kallt

