# ===
# FANS
# ===

# Part-cooling fan
# Controlled with M106 / M107 and the Mainsail slider.
[fan]
pin: PB7
kick_start_time: 0.5
off_below: 0.10

# Hotend cooling fan
# Runs with an active hotend target (> 0) or above heater_temp (50 C), including cooldown.
[heater_fan hotend_fan]
pin: PB6
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
kick_start_time: 0.5
