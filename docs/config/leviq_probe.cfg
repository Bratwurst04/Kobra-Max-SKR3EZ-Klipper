[output_pin leviq_reset]
pin: PB14
value: 1
shutdown_value: 1

# === LeviQ probe ===
[probe]
pin: ^!PB15

x_offset: 0
y_offset: 0
#z_offset: 0

speed: 3
lift_speed: 5

samples: 2
samples_result: median
sample_retract_dist: 5
samples_tolerance: 0.05
samples_tolerance_retries: 3
#DEBUG
#samples: 1
#sample_retract_dist: 5

activate_gcode: # Nollställer loadcell innan probe.
    SET_PIN PIN=leviq_reset VALUE=0
    G4 P100
    SET_PIN PIN=leviq_reset VALUE=1
    G4 P600

[safe_z_home]
home_xy_position: 200, 200 # Mitt på bedden
speed: 80
z_hop: 10
z_hop_speed: 5


# === Normal Bed Mesh ===
[bed_mesh]
speed: 120
horizontal_move_z: 5

mesh_min: 14,23
mesh_max: 405,423

probe_count: 7,7
algorithm: bicubic
bicubic_tension: 0.2

mesh_pps: 2,2

fade_start: 1
fade_end: 10
fade_target: 0