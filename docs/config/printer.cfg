# HISTORICAL REFERENCE ONLY: read config.md and ../STATUS.md first.
# Replace both REPLACE_WITH_YOUR_... fields before any local use.
[include mainsail.cfg]

# Printer
[include steppers.cfg]
[include tmc.cfg]
[include fans.cfg]
[include bed.cfg]
[include leviq_probe.cfg]
[include accessories.cfg]
[include macros.cfg]

# Extensions
#[include KAMP_Settings.cfg] # KAMP
#[include autotune_tmc.cfg] # TMC Autotune



[mcu]
serial: /dev/serial/by-id/REPLACE_WITH_YOUR_MCU_DEVICE_ID

[printer]
kinematics: cartesian

max_velocity: 300
max_accel: 3000
max_z_velocity: 10
max_z_accel: 100

[virtual_sdcard]
path: /home/REPLACE_WITH_YOUR_HOST_USER/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[exclude_object]
